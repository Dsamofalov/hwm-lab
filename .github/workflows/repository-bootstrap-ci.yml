name: Repository Bootstrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public trusted-lab skeleton
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/CODEOWNERS
          grep -q 'Public trusted evidence/lab policy repository' README.md
          grep -q 'currently has no raw corpus' README.md
          grep -q 'safe for full public disclosure' README.md
          for d in job-handlers manifests tests; do
            test -f "$d/.gitkeep"
            count="$(find "$d" -type f ! -name .gitkeep | wc -l)"
            test "$count" -eq 0
          done
